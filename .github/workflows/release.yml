name: release

# When a release is published on GitHub, run the tests, build PCAssistant.exe on a clean
# Windows machine, and attach it to the release for download.
on:
  release:
    types: [published]

permissions:
  contents: write  # needed to upload the .exe to the release

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build PCAssistant.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name PCAssistant ask_claude_gui.py
      - name: Attach the .exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/PCAssistant.exe --clobber
